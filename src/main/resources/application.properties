spring.application.name=be-foodgo

# JWT Configuration - Chuoi bi mat (secret) dung de ky va xac thuc JWT
# DOAN CHU NAY PHAI DU 256 BIT (32 ky tu) HOAC LON HON
# Thay doi gia tri nay thanh chuoi ngau nhien dai va phuc tap trong moi truong production
jwt.secret=FoodGoJwtSecretKey2026Nam3Ki2VeryLongAndSecure256BitSecretKeyForSigningTokens
# Thoi gian hieu luc cua access token (miliseconds)
# 86400000 ms = 24 gio
jwt.expiration=86400000
# Tien to Bearer token trong header Authorization
jwt.bearer-prefix=Bearer
