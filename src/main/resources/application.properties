spring.application.name=be-foodgo
server.port=8086
spring.time-zone=Asia/Ho_Chi_Minh

# Disable Spring DevTools auto-restart to prevent server restart on .java file changes
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Firebase Realtime Database URL
firebase.database.url=https://food-go-17a5d-default-rtdb.asia-southeast1.firebasedatabase.app/
firebase.storage.bucket=food-go-17a5d.appspot.com

# JWT Configuration
jwt.secret=FoodGoJwtSecretKey2026Nam3Ki2VeryLongAndSecure256BitSecretKeyForSigningTokens
jwt.expiration=10800000
jwt.refresh-expiration=2592000000
jwt.bearer-prefix=Bearer

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=foldershop83@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Enable/disable real email sending (set to false in dev to fall back to console)
app.email.enabled=true

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Configuration
cloudinary.cloud_name=dd51afnue
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Mapbox Configuration
mapbox.access-token=${MAPBOX_ACCESS_TOKEN}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent
